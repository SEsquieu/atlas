name: Android

on:
  push:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests
        run: ./gradlew testSecureDebugUnitTest testLanDebugUnitTest
      - name: Lint and debug APKs
        run: ./gradlew lintSecureDebug lintLanDebug assembleSecureDebug assembleLanDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-android-debug
          path: apps/atlas-android/app/build/outputs/apk/*/debug/*.apk
