name: Android

on:
  push:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests
        run: ./gradlew testSecureDebugUnitTest testLanDebugUnitTest
      - name: Lint and debug APKs
        run: ./gradlew lintSecureDebug lintLanDebug assembleSecureDebug assembleLanDebug

  installable:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: closed-alpha
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Require persistent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure the four ATLAS_ANDROID signing secrets in closed-alpha. Runner-generated debug keys cannot produce updatable APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-alpha.jks"
          chmod 600 "$RUNNER_TEMP/atlas-alpha.jks"
      - name: Build updatable APKs
        env:
          ATLAS_REQUIRE_STABLE_SIGNING: "true"
          ATLAS_ANDROID_KEYSTORE: ${{ runner.temp }}/atlas-alpha.jks
          ATLAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
          ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          export ATLAS_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew assembleSecureDebug assembleLanDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/secure/debug/app-secure-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/lan/debug/app-lan-debug.apk
      - name: Upload installable APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-android-installable
          path: apps/atlas-android/app/build/outputs/apk/*/debug/*.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-alpha.jks"
