name: Android

on:
  push:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testSecureDebugUnitTest testLanDebugUnitTest
      - name: Lint and debug APKs
        run: ./gradlew lintSecureDebug lintLanDebug assembleSecureDebug assembleLanDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android-debug
          path: apps/atlas-android/app/build/outputs/apk/*/debug/*.apk
