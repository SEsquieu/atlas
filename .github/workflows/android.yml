name: Android POC

on:
  push:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug APK
        run: ./gradlew assembleDebug
