name: Android

on:
  workflow_dispatch:
    inputs:
      installable:
        description: Generate signed APKs (disable for implementation validation)
        type: boolean
        default: true
      lan:
        description: Build LAN variants for a specific cleartext-network test
        type: boolean
        default: false
      developer:
        description: Build DEV variants for targeted diagnostic tooling
        type: boolean
        default: false
  push:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/android.yml"

env:
  INCLUDE_LAN: ${{ github.event_name == 'workflow_dispatch' && inputs.lan }}
  INCLUDE_DEV: ${{ github.event_name == 'workflow_dispatch' && inputs.developer }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Unit tests
        run: |
          tasks=(testSecureDebugUnitTest)
          if [ "$INCLUDE_LAN" = true ]; then tasks+=(testLanDebugUnitTest); fi
          if [ "$INCLUDE_DEV" = true ]; then
            tasks+=(testSecureDeveloperUnitTest)
            if [ "$INCLUDE_LAN" = true ]; then tasks+=(testLanDeveloperUnitTest); fi
          fi
          ./gradlew "${tasks[@]}"
      - name: Lint selected variants
        run: |
          tasks=(lintSecureDebug)
          if [ "$INCLUDE_LAN" = true ]; then tasks+=(lintLanDebug); fi
          if [ "$INCLUDE_DEV" = true ]; then
            tasks+=(lintSecureDeveloper)
            if [ "$INCLUDE_LAN" = true ]; then tasks+=(lintLanDeveloper); fi
          fi
          ./gradlew "${tasks[@]}"

  installable:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[validation-only]')) || (github.event_name == 'workflow_dispatch' && inputs.installable)
    needs: build
    runs-on: ubuntu-latest
    environment: closed-alpha
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Require persistent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure the four ATLAS_ANDROID signing secrets in closed-alpha. Runner-generated debug keys cannot produce updatable APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-alpha.jks"
          chmod 600 "$RUNNER_TEMP/atlas-alpha.jks"
      - name: Build updatable APKs
        env:
          ATLAS_REQUIRE_STABLE_SIGNING: "true"
          ATLAS_ANDROID_KEYSTORE: ${{ runner.temp }}/atlas-alpha.jks
          ATLAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
          ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: |
          export ATLAS_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          tasks=(assembleSecureDebug)
          if [ "$INCLUDE_LAN" = true ]; then tasks+=(assembleLanDebug); fi
          if [ "$INCLUDE_DEV" = true ]; then
            tasks+=(assembleSecureDeveloper)
            if [ "$INCLUDE_LAN" = true ]; then tasks+=(assembleLanDeveloper); fi
          fi
          ./gradlew "${tasks[@]}"
          find app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          done
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          markers = (b'DevelopmentProbeScreen', b'DevelopmentProbeRunner', b'ProbeRequestBuilder')
          for apk in Path('app/build/outputs/apk').glob('*/*/*.apk'):
              with zipfile.ZipFile(apk) as z:
                  dex = [z.read(n) for n in z.namelist() if n.endswith('.dex')]
                  has_panel = all(any(marker in data for data in dex) for marker in markers)
                  assert has_panel == (apk.parent.name == 'developer'), f'DEV source isolation failed: {apk}'
          PYCODE
      - name: Upload installable APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-android-installable
          if-no-files-found: error
          path: |
            apps/atlas-android/app/build/outputs/apk/*/debug/*.apk
            apps/atlas-android/app/build/outputs/apk/*/developer/*.apk
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/atlas-alpha.jks"
