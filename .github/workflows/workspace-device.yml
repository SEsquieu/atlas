name: Workspace device verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/atlas-android/**"
      - ".github/workflows/workspace-device.yml"
  push:
    branches: [main]
    paths:
      - "apps/atlas-android/**"
      - "!apps/atlas-android/RELEASE"
      - ".github/workflows/workspace-device.yml"
permissions:
  contents: read
concurrency:
  group: workspace-device-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('validation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash apps/atlas-android/verify-workspace-device.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-device-evidence-api-${{ matrix.api }}
          path: |
            apps/atlas-android/app/build/device-evidence
            apps/atlas-android/app/build/reports/androidTests
            apps/atlas-android/app/build/outputs/androidTest-results
          retention-days: 14
