name: Atlas Cloud

on:
  push:
    paths:
      - "apps/atlas-cloud/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "apps/atlas-cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-cloud
    env:
      NEXT_PUBLIC_APP_URL: https://atlas.example
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      OPENAI_API_KEY: placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_SUBSCRIPTION_PRICE_ID: price_subscription
      STRIPE_CREDIT_BLOCK_PRICE_ID: price_block
      ATLAS_SUBSCRIPTION_CREDITS_MICROS: 10000000
      ATLAS_CREDIT_BLOCK_CREDITS_MICROS: 5000000
      ATLAS_MAX_REQUEST_CREDITS_MICROS: 100000
      ATLAS_MODEL_ROUTES_JSON: '{"fast":"gpt-5.6-luna","vision":"gpt-5.6-luna","reasoning":"gpt-5.6-terra","fallback":"gpt-5.6-luna"}'
      ATLAS_MODEL_RATES_JSON: '{"gpt-5.6-luna":{"inputCreditsPerMillion":1,"outputCreditsPerMillion":4},"gpt-5.6-terra":{"inputCreditsPerMillion":3,"outputCreditsPerMillion":15}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas-cloud/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
