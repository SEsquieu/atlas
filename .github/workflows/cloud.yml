name: Atlas Cloud

on:
  push:
    paths:
      - "apps/atlas-cloud/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "apps/atlas-cloud/**"
      - ".github/workflows/cloud.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atlas-cloud
    env:
      NEXT_PUBLIC_APP_URL: https://atlas.example
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      OPENAI_API_KEY: placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_SUBSCRIPTION_PRICE_ID: price_subscription
      STRIPE_CREDIT_BLOCK_PRICE_ID: price_block
      ATLAS_SUBSCRIPTION_CREDITS_MICROS: 10000000
      ATLAS_CREDIT_BLOCK_CREDITS_MICROS: 5000000
      ATLAS_MAX_REQUEST_CREDITS_MICROS: 100000
      ATLAS_MODEL_CATALOG_JSON: '[{"id":"test-model","enabled":true,"supportsVision":true,"supportsTools":true,"reasoningEfforts":["none","low","medium","high"],"quality":{"fast":1,"vision":1,"reasoning":1,"fallback":1},"speed":1,"economy":1,"inputCreditsPerMillion":1,"outputCreditsPerMillion":4}]'
      ATLAS_MODEL_CATALOG_REVISION: ci-fixture-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/atlas-cloud/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
