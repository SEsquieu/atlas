name: Android signed alpha

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0-alpha.5

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: closed-alpha
    defaults:
      run:
        working-directory: apps/atlas-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ATLAS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-alpha.jks"
          chmod 600 "$RUNNER_TEMP/atlas-alpha.jks"
      - name: Verify and build signed variants
        env:
          ATLAS_ANDROID_KEYSTORE: ${{ runner.temp }}/atlas-alpha.jks
          ATLAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEYSTORE_PASSWORD }}
          ATLAS_ANDROID_KEY_ALIAS: ${{ secrets.ATLAS_ANDROID_KEY_ALIAS }}
          ATLAS_ANDROID_KEY_PASSWORD: ${{ secrets.ATLAS_ANDROID_KEY_PASSWORD }}
        run: ./gradlew testSecureDebugUnitTest testLanDebugUnitTest lintSecureRelease lintLanRelease assembleSecureRelease assembleLanRelease
      - name: Verify signatures and package
        env:
          RELEASE_VERSION: 0.1.0-alpha.5
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          SECURE_APK=app/build/outputs/apk/secure/release/app-secure-release.apk
          LAN_APK=app/build/outputs/apk/lan/release/app-lan-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$SECURE_APK" > signing-certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$LAN_APK"
          cp "$SECURE_APK" "atlas-android-$RELEASE_VERSION-secure.apk"
          cp "$LAN_APK" "atlas-android-$RELEASE_VERSION-trusted-lan.apk"
          sha256sum atlas-android-*.apk > SHA256SUMS.txt
          printf '{"version":"%s","tag":"%s","commit":"%s","variants":["secure","trusted-lan"],"minSdk":28,"targetSdk":35}\n' \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$GITHUB_SHA" > provenance.json
          zip -9 "atlas-android-$RELEASE_VERSION.zip" atlas-android-*.apk SHA256SUMS.txt signing-certificate.txt provenance.json
      - name: Publish controlled prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Atlas Alongside v0.1.0-alpha.5" \
            --notes-file ../../docs/releases/v0.1.0-alpha.5.md \
            atlas-android-*.apk atlas-android-0.1.0-alpha.5.zip SHA256SUMS.txt signing-certificate.txt provenance.json
