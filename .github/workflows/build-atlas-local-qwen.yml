name: Build Atlas LAN APK

on:
  push:
    branches:
      - codex/atlas-local-qwen-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android source snapshot
        run: |
          base64 --decode build-input/atlas-android-local-qwen-fix.tar.gz.b64 | tar -xz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build LAN APK
        working-directory: apps/atlas-android
        run: |
          chmod +x gradlew
          ./gradlew testLanDebugUnitTest assembleLanDebug

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-local-qwen-lan-debug
          path: apps/atlas-android/app/build/outputs/apk/lan/debug/*.apk
          if-no-files-found: error
