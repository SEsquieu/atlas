name: Feature proposal
description: Propose a focused runtime, app, adapter, or documentation improvement
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What physical-agent or developer problem should Atlas solve?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed boundary
      description: Should this live in the open platform, managed inference, or Atlas Enterprise, and why?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and tradeoffs
      description: Include user evidence and effects on privacy, cost, latency, tools, compatibility, and failure behavior.
